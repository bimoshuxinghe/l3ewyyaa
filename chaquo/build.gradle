plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace = 'com.fongmi.chaquo'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
    }

    flavorDimensions = ["abi"]

    productFlavors {
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

// Chaquopy 15.x 使用顶层 `chaquopy` 块（旧版 `python { }` 块仅在 14 及更早版本可用）。
chaquopy {
    defaultConfig {
        // 使用 Python 3.11（用户指定）。Chaquopy 15.0.1 内置的 CPython 3.11
        // 原生库可在 minSdk 21（Android 5.0）上运行；requirements 中不使用
        // lxml/ujson 等无 API 21 wheel 的包，HTML 解析由 htmlcompat 兜底。
        version = "3.11"

        pip {
            // Chaquopy 官方原生包仓库。带 C 扩展的包（如 pycryptodome）的
            // android_<api>_<abi> wheel 只在这里提供。
            options("--extra-index-url", "https://chaquo.com/pypi-13.1/")

            // 目标解释器固定为 Chaquopy 内置的 Python 3.11，但 pip 默认用
            // 构建机上 host Python 的小版本号判断 Requires-Python，
            // host 版本较旧时会误拒一些包。忽略该检查（实际解释器版本是确定的）。
            options("--ignore-requires-python")

            install("-r", "requirements.txt")
        }
    }

    sourceSets {
        main {
            srcDir("src/main/python")
        }
    }
}

dependencies {
    implementation project(':catvod')
    // androidx.annotation：Platform.java 使用 @NonNull。
    implementation libs.annotation
    coreLibraryDesugaring libs.desugar
}
