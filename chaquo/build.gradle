plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace = 'com.fongmi.chaquo'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        python {
            // 使用 Python 3.10（与 fix/danmaku-fongmi-port 分支一致，该分支
            // 已验证 Chaquopy 17.0.0 + AGP 9.4 的组合可正常构建运行）。
            // 注意：Chaquopy 官方仓库中 lxml/ujson 等原生包最低只提供
            // android_24 wheel，而本项目 minSdk=21（Android 5.0），因此
            // requirements.txt 中不含这些包，HTML 解析由 htmlcompat 兜底。
            version = "3.10"
            pip {
                install("-r", "requirements.txt")
            }
        }
    }

    flavorDimensions = ["abi"]

    productFlavors {
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':catvod')
    // androidx.annotation：Platform.java 使用 @NonNull。
    implementation libs.annotation
    coreLibraryDesugaring libs.desugar
}
