name: Build TV (Leanback) V7A APK

on:
  push:
    branches:
      - main
      - fix/danmaku-fongmi-port
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Accept SDK licenses
        run: |
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -path '*/bin/*' | head -1)"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
          fi
          # 兜底：直接写入许可证哈希，避免依赖 sdkmanager 的 PATH
          mkdir -p "$ANDROID_HOME/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c7c8a12b03355" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "504667f4c0de7af1a06de9f4b1727b84351f2914" > "$ANDROID_HOME/licenses/android-ndk-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Use installed JDK for Gradle daemon
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Build leanback armeabi-v7a release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleLeanbackArmeabi_v7aRelease --no-daemon --no-build-cache --stacktrace 2>&1 | tee build.log

      - name: Debug APK search
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f -not -path "*/.gradle/*" 2>/dev/null | head -20
          echo "--- Build outputs dirs ---"
          find . -type d -path "*/build/outputs/*" 2>/dev/null | head -10

      # FIX: 不再假定产物目录/按 "leanback*" 文件名前缀匹配（AGP 9 默认命名 app-leanback-...-release.apk，
      # 且输出目录可能不再是 app/build/outputs/apk）。直接全项目递归收集所有 .apk，避免收集为空导致上传失败。
      - name: Collect APK
        if: success()
        run: |
          mkdir -p Release/apk
          find . -name "*.apk" -type f -not -path "*/.gradle/*" -not -path "*/Release/apk/*" -exec cp {} Release/apk/ \;
          echo "--- Files in Release/apk ---"
          ls -la Release/apk/ 2>/dev/null || echo "Release/apk is empty"
          echo "" >> build.log
          echo "=== APK Collection Results ===" >> build.log
          find . -name "*.apk" -type f -not -path "*/.gradle/*" -not -path "*/Release/apk/*" >> build.log 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: leanback-armeabi-v7a-release-apk
          path: Release/apk/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Commit build result
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github/build-logs
          if [ -f build.log ]; then cp build.log .github/build-logs/latest-tv-v7a-build.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/build-logs/latest-tv-v7a-build.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No build result files to commit"
          else
            git commit -m "Update TV V7A build result [skip ci]"
            git push || echo "::warning::Build log push failed."
          fi
