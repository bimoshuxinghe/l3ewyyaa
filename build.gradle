plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    // 官方 Chaquopy 15.0.1：最后一个支持 minSdk 21（Android 5.0）的版本，
    // 支持 AGP 7.0-8.5（本仓库已降级到 AGP 8.5.2 + Gradle 8.9 配合）。
    id "com.chaquo.python" version "15.0.1" apply false
}

// AGP 8.6 的 lint 内嵌 Kotlin 编译器为 2.0.x，分析 Kotlin 2.2 元数据的依赖
// （如 okhttp 5.3.2）会报 metadata 不兼容；lintVital 只影响 release 检查、
// 不影响 APK 产物，CI 构建统一关闭。
subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            it.android {
                lint { checkReleaseBuilds = false }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

project(':app').tasks.matching { it.name ==~ /assemble.+Release/ }.configureEach {
    doLast {
        copy {
            from fileTree("$rootDir/app/build/outputs/apk") { include '**/release/*.apk' }
            into "$rootDir/Release/apk"
            eachFile { it.path = it.name }
            includeEmptyDirs = false
        }
    }
}